<!DOCTYPE html>
<html lang="en">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pistas Jacarilla</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="inicioSesion.css">
</head>



<body>

    <header>
        <a href="index.html" class="volverInicio">
            <img src="casa.svg" alt="Inicio">
        </a>

        <div class="logo">
            <img src="logo_sin_fondo.png" alt="Pistas Jacarilla">
        </div>
    </header>

    
    <div class="inicioSesionEntero">
        <div class="overlay">
            <div class="inicioSesion">
                <h2>Iniciar sesión</h2>
                <form>
                    <input type="email" placeholder="Correo electrónico" required>
                    <input type="password" placeholder="Contraseña" required>
                    <button type="submit">Entrar</button>
                </form>
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
            </div>
        </div>
    </div>

</body>
</html>
