<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pistas Jacarilla</title>
    <link rel="stylesheet" href="inicio.css">
</head>

<body>

<header>
    <div class="menu">☰</div>

    <div class="logo">
        <img src="logo.png" alt="Logo">
    </div>

    <a href="inicioSesion.html" class="usuario">👤</a>
</header>

<main>
    <div class="overlay">

        <h1>Reservar pista</h1>
        <p class="subtitulo">Selecciona deporte y horario</p>

        <div class="filtros">
            <div class="selector">
                📅 <span><strong>Fecha:</strong> 01 enero 2026</span>
                <span class="flecha">▾</span>
            </div>

            <div class="selector">
                🕒 <span><strong>Hora:</strong> Seleccionar</span>
                <span class="flecha">▾</span>
            </div>
        </div>

        <div class="tarjetas">
            <div class="card futbol">
                <div class="contenido">
                    <h3>⚽ Fútbol</h3>
                    <p>2 pistas disponibles</p>
                    <span class="precio">Desde 6 €</span>
                </div>
            </div>

            <div class="card tenis activa">
                <div class="contenido">
                    <h3>🎾 Tenis</h3>
                    <p>3 pistas disponibles</p>
                    <span class="precio">Desde 5 €</span>
                </div>
            </div>

            <div class="card baloncesto">
                <div class="contenido">
                    <h3>🏀 Baloncesto</h3>
                    <p>2 pistas disponibles</p>
                    <span class="precio">Desde 6 €</span>
                </div>
            </div>
        </div>

    </div>
</main>

</body>
</html>
