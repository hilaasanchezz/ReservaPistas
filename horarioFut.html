<!DOCTYPE html>
<html lang="es">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar horario</title>
    <link rel="stylesheet" href="horario.css">
</head>



<body>
<header>
    <a href="index.html" class="volverInicio">
        <img src="casa.svg" alt="Inicio">
    </a>

    <div class="logo">
        <img src="logo_sin_fondo.png" alt="Logo">
    </div>

    <a href="inicioSesion.html" class="usuario">👤</a>
</header>



<main>
    <div class="overlay">

        

        <div class="cajaHorarios">

            <div class="deporteSelector">
                <span>‹</span>
                <span><strong>FÚTBOL</strong></span>
                <span>›</span>
            </div>

            <div class="fechaSelector">
                <span>‹</span>
                <span><strong>01 enero 2026</strong></span>
                <span>›</span>
            </div>

            <div class="horarios">
                <button>09:00</button>
                <button>09:30</button>
                <button>10:00</button>
                <button>10:30</button>
                <button>11:00</button>
                <button>11:30</button>

                <button>12:00</button>
                <button>17:00</button>
                <button>17:30</button>
                <button>18:00</button>
                <button>18:30</button>
                <button>19:00</button>

                <button>19:30</button>
                <button>20:00</button>
                <button>20:30</button>
                <button>21:00</button>
                <button>21:30</button>
                <button>22:00</button>
            </div>
        </div>
    </div>
</main>

</body>
</html>
